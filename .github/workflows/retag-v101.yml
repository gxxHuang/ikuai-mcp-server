name: Retag

# 一次性用途：把 v1.0.1 标签从旧提交重新指向当前 main HEAD。
# 工作流会先删除自己并提交，再打标签，因此标签指向的树里不含本文件。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retag v1.0.1 to current HEAD
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "before: main=$(git rev-parse --short HEAD)  v1.0.1=$(git rev-parse --short refs/tags/v1.0.1 2>/dev/null || echo none)"

          git rm -q .github/workflows/retag-v101.yml
          git commit -q -m "chore: 移除临时 retag 工作流（v1.0.1 标签重指向用）"
          git push -q origin HEAD:main

          git push origin :refs/tags/v1.0.1 || true
          git tag -f v1.0.1
          git push -q origin refs/tags/v1.0.1 --force

          echo "after : main=$(git rev-parse --short HEAD)  v1.0.1=$(git rev-parse --short refs/tags/v1.0.1)"
